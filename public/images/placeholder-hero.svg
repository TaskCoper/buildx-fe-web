<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="presentation">
  <!-- Ảnh nền hero TẠM: chờ ảnh thật của khách. Cố ý trung tính (không chữ, không
       thương hiệu) để chữ hero đè lên vẫn đọc được, và để thay bằng URL ảnh thật
       ở khu quản trị là xong — khóa ảnh `home.hero` không đổi. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ec"/>
      <stop offset="1" stop-color="#dfe6dd"/>
    </linearGradient>
    <pattern id="hatch" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#0f3d20" stroke-opacity="0.05" stroke-width="10"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#hatch)"/>
  <g transform="translate(1090 380)" fill="none" stroke="#0f3d20" stroke-opacity="0.22" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="0" width="280" height="200" rx="18"/>
    <circle cx="72" cy="66" r="22"/>
    <path d="M18 176 L104 96 L168 154 L206 122 L262 176"/>
  </g>
</svg>
