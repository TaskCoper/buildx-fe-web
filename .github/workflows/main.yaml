name: Deploy Application

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality / buildx-fe-web
    uses: ./.github/workflows/quality.yaml
    permissions:
      contents: read

  build-dev:
    name: Build / buildx-fe-web / Dev
    needs: quality
    if: ${{ github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      environment: dev

  deploy-dev:
    name: Deploy / Dev / buildx-fe-web
    needs: build-dev
    if: ${{ github.ref == 'refs/heads/develop' }}
    uses: ./.github/workflows/deploy-application.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      profile: dev
      tag: ${{ needs.build-dev.outputs.image-tag }}
      run-on: linhdanhthue

  build-prod:
    name: Build / buildx-fe-web / Prod
    needs: quality
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/build-image.yaml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      environment: prod

  deploy-prod:
    name: Deploy / Prod / buildx-fe-web
    needs: build-prod
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/deploy-application.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit
    with:
      actor: ${{ github.actor }}
      repository: ${{ github.repository }}
      profile: prod
      tag: ${{ needs.build-prod.outputs.image-tag }}
      run-on: bmtdecor
