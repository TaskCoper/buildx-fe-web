name: Build Image

on:
  workflow_call:
    inputs:
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      environment:
        required: false
        type: string
        default: dev
    outputs:
      image-tag:
        description: Image tag for the exact commit built by this workflow
        value: ${{ jobs.build-service-image.outputs.image-tag }}

jobs:
  build-service-image:
    name: Build Service Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    env:
      SOURCE_REPOSITORY: ${{ inputs.repository }}
      PROFILE: ${{ inputs.environment }}
      BMT_API_ORIGIN: ${{ secrets.BMT_API_ORIGIN || 'https://bmt-api.vnzdna.com' }}
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || '/api/v1' }}
      NEXT_PUBLIC_API_TIMEOUT: ${{ secrets.NEXT_PUBLIC_API_TIMEOUT || '30000' }}
      NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME || 'BuildX AI' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_USE_MOCK_AUTH: ${{ secrets.NEXT_PUBLIC_USE_MOCK_AUTH || 'false' }}
      NEXT_PUBLIC_USE_MOCK_API: ${{ secrets.NEXT_PUBLIC_USE_MOCK_API || 'false' }}
      NEXT_PUBLIC_VIETMAP_API_KEY: ${{ secrets.NEXT_PUBLIC_VIETMAP_API_KEY }}
      # Compose requires a network name while parsing; builds do not attach to it.
      NETWORK: buildx-image-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name and tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "$PROFILE" in dev) ;; *) exit 1 ;; esac
          echo "REGISTRY=ghcr.io/${SOURCE_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "TAG=$PROFILE-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "tag=$PROFILE-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f .docker/compose.yaml --profile "$PROFILE" build
          docker compose -f .docker/compose.yaml --profile "$PROFILE" push
          docker tag "$REGISTRY/buildx-fe-web:$TAG" "$REGISTRY/buildx-fe-web:$PROFILE-latest"
          docker push "$REGISTRY/buildx-fe-web:$PROFILE-latest"
